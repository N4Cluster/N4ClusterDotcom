<svg xmlns="http://www.w3.org/2000/svg" viewBox="340 320 344 384" role="img" aria-label="N4Cluster">
  <defs>
    <linearGradient id="hex" gradientUnits="userSpaceOnUse" x1="0" y1="332" x2="0" y2="692">
      <stop offset="0" stop-color="#34CAD6"/>
      <stop offset=".5" stop-color="#216587"/>
      <stop offset="1" stop-color="#1F4266"/>
    </linearGradient>
    <!-- one gradient for the whole front face of the N, so the left stroke and diagonal join without a seam -->
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="409" x2="0" y2="612">
      <stop offset="0" stop-color="#2ACCDF"/>
      <stop offset=".5" stop-color="#24B9CE"/>
      <stop offset="1" stop-color="#1B82A0"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="0" y1="494" x2="0" y2="602">
      <stop offset="0" stop-color="#135A7A"/>
      <stop offset="1" stop-color="#0F4466"/>
    </linearGradient>
    <linearGradient id="diag" gradientUnits="userSpaceOnUse" x1="470" y1="412" x2="565" y2="612">
      <stop offset="0" stop-color="#2ACADC"/>
      <stop offset=".55" stop-color="#22B4C8"/>
      <stop offset="1" stop-color="#1D86A3"/>
    </linearGradient>
    <linearGradient id="inner" gradientUnits="userSpaceOnUse" x1="0" y1="452" x2="0" y2="526">
      <stop offset="0" stop-color="#145C80"/>
      <stop offset="1" stop-color="#0E3F63"/>
    </linearGradient>
    <linearGradient id="barR" gradientUnits="userSpaceOnUse" x1="0" y1="408" x2="0" y2="590">
      <stop offset="0" stop-color="#5ED0DA"/>
      <stop offset=".18" stop-color="#2CC3D6"/>
      <stop offset=".45" stop-color="#26A8C0"/>
      <stop offset=".67" stop-color="#196B89"/>
      <stop offset=".9" stop-color="#193A63"/>
    </linearGradient>
  </defs>
  <polygon points="511.5,332.5 667,422.3 667,601.7 511.5,691.5 356,601.7 356,422.3"
           fill="none" stroke="url(#hex)" stroke-width="13" stroke-linejoin="round"/>
  <!-- bottom corner tucked under the diagonal's corner (600,590) so no dark sliver shows past it -->
  <polygon points="560,408 612,440 612,585 600,590 560,560" fill="url(#barR)"/>
  <polygon points="553,452 553,530 520,500 500,484" fill="url(#inner)"/>
  <!-- fold under the left stroke: top runs up under the diagonal, so no cream crack between them -->
  <polygon points="463,470 478,470 478,584 463,602" fill="url(#side)"/>
  <!-- left stroke + diagonal share one top edge (414,437)->(467,409) so there's no step where they meet -->
  <polygon points="414,437 467,409 463,486 463,601 414,584" fill="url(#front)"/>
  <polygon points="414,437 467,409 600,590 556,612 548,608 482,512 463,486 414,460" fill="url(#front)"/>
</svg>
